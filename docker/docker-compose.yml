# Run from this folder (build context is the repository root, env vars come from ../.env):
#   Without public tunnel:  docker compose -p mtodo up --build
#   With ngrok tunnel:       docker compose -p mtodo --profile tunnel up --build
#
# Note: the top-level `name:` key requires Docker Compose v2 (`docker compose`).
# The legacy v1 binary (`docker-compose`) rejects it, so the project name is
# passed via `-p mtodo` / COMPOSE_PROJECT_NAME instead to stay compatible.

services:
  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    container_name: mtodo-server
    restart: unless-stopped
    # Load shared secrets/credentials from the repo-root .env file.
    env_file:
      - ../.env
    # Docker-specific overrides (take precedence over env_file).
    environment:
      PORT: 4000
      NODE_ENV: production
      # SQLite lives on the named volume mounted at /data.
      DATABASE_FILE: /data/mtodo.sqlite
    volumes:
      - mtodo-data:/data
    ports:
      - "4000:4000"

  client:
    build:
      context: ..
      dockerfile: docker/client.Dockerfile
      args:
        # Relative base URL: the client calls the API same-origin and nginx
        # proxies /api/ to the server container (see docker/nginx.conf). This
        # works on localhost, LAN, and the ngrok tunnel alike. A dedicated var
        # (not VITE_API_URL) is used so the dev value in ../.env can't leak into
        # the prod bundle. Override only to host the API on a separate origin.
        VITE_API_URL: ${DOCKER_CLIENT_API_URL:-/api}
    container_name: mtodo-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"

  # Exposes the client to the public internet via an ngrok tunnel.
  # Set NGROK_AUTHTOKEN in ../.env (get one at https://dashboard.ngrok.com).
  # Inspect tunnels / public URL at http://localhost:4040.
  #
  # Behind the "tunnel" profile, so it is NOT started by a plain `up`.
  #   Without ngrok:  docker compose -p mtodo up --build
  #   With ngrok:     docker compose -p mtodo --profile tunnel up --build
  ngrok:
    profiles: ["tunnel"]
    image: ngrok/ngrok:latest
    container_name: mtodo-ngrok
    restart: unless-stopped
    depends_on:
      - client
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: ["http", "client:80"]
    ports:
      - "4040:4040"

volumes:
  mtodo-data:

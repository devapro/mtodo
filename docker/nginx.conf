server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API calls to the server container so the client can talk to the API
  # same-origin. This makes the app work regardless of how it is reached
  # (localhost, LAN IP, or the ngrok tunnel) without baking a host into the
  # client bundle. The "server" hostname resolves on the compose network.
  location /api/ {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback so client-side routes work on refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
